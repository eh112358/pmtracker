services:
  pmtracker:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    container_name: pmtracker
    ports:
      - "3000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/pmtracker.db
      - GOLDAPI_KEY=${GOLDAPI_KEY:-}
    restart: unless-stopped
